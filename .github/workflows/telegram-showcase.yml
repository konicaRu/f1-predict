name: telegram-showcase-2026-11-19
# Отдельная разовая отправка, регулярные напоминания не затрагивает.
on:
  schedule:
    - cron: '0 6 19 11 *' # 19 ноября, 09:00 МСК; год дополнительно ограничен ниже и в JS.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: telegram-showcase-2026-11-19
  cancel-in-progress: false
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Проверить дату (ручной запуск только проверяет, не отправляет)
        id: due
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(date -u +%F)" = "2026-11-19" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.due.outputs.run == 'true'
        with:
          node-version: 20
      - name: Установить зависимости и Chromium
        if: steps.due.outputs.run == 'true'
        working-directory: scripts/telegram
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Проверить досье и разовую отправку
        if: steps.due.outputs.run == 'true'
        run: |
          npm test --prefix scripts/telegram
          npm run test:render --prefix scripts/telegram
      - name: Записать конфигурацию
        if: steps.due.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          cat > .env <<EOF
          SUPABASE_DB_URL=$SUPABASE_DB_URL
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          TELEGRAM_ADMIN_CHAT_ID=$TELEGRAM_ADMIN_CHAT_ID
          EOF
      - name: Отправить оба формата в общий чат (либо проверить без отправки)
        if: steps.due.outputs.run == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/telegram/showcase.js --check
          else
            node scripts/telegram/showcase.js
          fi
      - name: Сообщить владельцу об ошибке
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "text=Не удалось завершить разовую демонстрацию досье. Автоматически не повторяю сообщения. Лог: ${RUN_URL}"
