name: keepalive
# Бесплатный Supabase засыпает после ~7 дней недостаточной активности БД (plan §11).
# ВАЖНЫЙ УРОК (инцидент 2026-07-14): прежний SELECT под RLS возвращал 0 строк (анон —
# не член лиги) и НЕ считался активностью, хотя джоба была зелёной → проект уснул.
# Теперь дёргаем RPC keepalive_ping() — он делает РЕАЛЬНЫЙ UPDATE (SECURITY DEFINER,
# в обход RLS) = однозначная активность БД. Плюс ДВАЖДЫ В ДЕНЬ (scheduled-джобы GitHub
# ненадёжны, берём частотой) → таймер простоя обнуляется → проект жив → pg_cron жив.
on:
  schedule:
    - cron: '17 6 * * *'    # каждый день 06:17 UTC (~09:17 МСК)
    - cron: '17 18 * * *'   # каждый день 18:17 UTC (~21:17 МСК)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC keepalive_ping (real UPDATE, resets idle timer)
        run: |
          resp=$(curl -s -w "\n%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")
          body=$(echo "$resp" | head -n -1)
          code=$(echo "$resp" | tail -n1)
          echo "HTTP $code, pinged_at=$body"
          test "$code" = "200"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Keepalive упал = БД не ответила на пинг (уснула или недоступна). Сторож в Supabase в этом
      # случае сам ничего не пришлёт — сообщаем напрямую. Тихие часы 23:00-10:00 МСК: ночью молчим,
      # следующий слот (утром) пришлёт, если проблема осталась.
      - name: Тревога админу, если keepalive упал
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          h=$(TZ=Europe/Moscow date +%H)
          if [ "$h" -ge 23 ] || [ "$h" -lt 10 ]; then
            echo "Тихие часы (МСК ${h}:xx) — не будим"
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "text=🚨 Сторож F1 Predict: keepalive не достучался до Supabase — БД уснула или недоступна. Проверить дэшборд Supabase. Лог: ${RUN_URL}"
